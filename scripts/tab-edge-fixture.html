<!doctype html><html lang="ko" data-theme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tab edge geometry QA</title>
<link rel="stylesheet" href="../js/experience-finish.css"><link rel="stylesheet" href="../js/capsule-standby.css"><link rel="stylesheet" href="../js/tab-touch.css">
<style>
:root{--shell-blue:#467ada;--glass-muted:#647080;--glass-sheen:#ffffff90;--glass-lip:#ffffffb0;--glass-chrome:#fff;--glass-edge:#dce1ee}*{box-sizing:border-box}body{margin:0;padding:16px;background:#edf1f8;font:14px system-ui;color:#18202d}h1{font-size:18px}h2{font-size:14px;margin:18px 0 8px}.prime-choice-picker{display:flex;height:58px;gap:2px;width:100%;max-width:900px}button{flex:1;min-width:0;border:0;font:600 14px system-ui;min-height:48px;background:none;padding:8px}.static-preview{pointer-events:none}output{display:block;margin-top:12px;overflow-wrap:anywhere;font:12px monospace}
html[data-theme=dark] body{background:#151921;color:#edf0f7}
</style><body><h1>공통 선택 표시 · 경계 검사</h1>
<h2>첫 칸 누름 (상태 미리보기)</h2><div id="first" class="edge-preview static-preview"><button role="radio" aria-checked="true">첫 칸</button><button role="radio">가운데</button><button role="radio">마지막</button></div>
<h2>마지막 칸 누름 (상태 미리보기)</h2><div id="last" class="edge-preview static-preview"><button role="radio">첫 칸</button><button role="radio">가운데</button><button role="radio" aria-checked="true">마지막</button></div>
<h2>실제 포인터 드래그</h2><div id="live" class="prime-choice-picker"><button role="radio" aria-checked="true">첫 칸</button><button role="radio">가운데</button><button role="radio">마지막</button></div><output id="gestureProof">대기</output>
<script src="../js/liquid-tabs.js"></script><script>
const dark=new URLSearchParams(location.search).has('dark');if(dark)document.documentElement.dataset.theme='dark';
document.querySelectorAll('.prime-choice-picker').forEach(bar=>bar.addEventListener('click',e=>{if(!e.target.matches('button'))return;for(const b of bar.querySelectorAll('button'))b.setAttribute('aria-checked',String(b===e.target));}));
function previews(){for(const id of ['first','last']){const bar=document.getElementById(id);bar.classList.add('prime-choice-picker','prime-slide-bar','is-tab-held');let lens=bar.querySelector('.prime-tab-lens');if(!lens){lens=document.createElement('span');lens.className='prime-tab-lens';lens.setAttribute('aria-hidden','true');bar.append(lens);}lens.style.setProperty('transition','none');const b=bar.querySelector('[aria-checked=true]'),p=bar.getBoundingClientRect(),r=b.getBoundingClientRect(),g=PrimeLiquidTabs.lensGeometry(r.left-p.left-bar.clientLeft,r.top-p.top-bar.clientTop,r.width,r.height,bar.clientWidth,bar.clientHeight,true);for(const [k,v]of Object.entries({'--tab-x':g.left+'px','--tab-y':g.top+'px','--tab-width':g.width+'px','--tab-height':g.height+'px','--tab-scale-x':g.sx,'--tab-scale-y':g.sy}))lens.style.setProperty(k,String(v));}}
addEventListener('load',previews);addEventListener('resize',()=>requestAnimationFrame(previews));
const bar=document.getElementById('live'),output=document.getElementById('gestureProof');let trace=[],frames=0,clicks=0,grabOffset=0;
bar.addEventListener('click',()=>clicks++);bar.addEventListener('pointerdown',e=>{trace=[];frames=0;clicks=0;const r=e.target.closest('button').getBoundingClientRect();grabOffset=e.clientX-(r.left+r.right)/2;});bar.addEventListener('pointermove',e=>{const x=e.clientX,y=e.clientY;requestAnimationFrame(()=>{const p=bar.getBoundingClientRect(),r=bar.querySelector('.prime-tab-lens').getBoundingClientRect(),items=[...bar.querySelectorAll('button')].map(b=>{const r=b.getBoundingClientRect();return{button:b,center:(r.left+r.right)/2,y:(r.top+r.bottom)/2};}),center=PrimeLiquidTabs.dragCenter(x,grabOffset,items),hit=PrimeLiquidTabs.nearest(items,center,y),b=hit.button.getBoundingClientRect(),g=PrimeLiquidTabs.lensGeometry(center-p.left-bar.clientLeft-b.width/2,b.top-p.top-bar.clientTop,b.width,b.height,bar.clientWidth,bar.clientHeight,true),expected=p.left+bar.clientLeft+g.left+b.width/2;trace.push({x,left:r.left,right:r.right,center:(r.left+r.right)/2,expected,error:Math.abs((r.left+r.right)/2-expected),held:bar.classList.contains('is-tab-dragging'),overflow:Math.max(0,p.left-r.left,r.right-p.right)});frames++;});});
bar.addEventListener('pointerup',()=>requestAnimationFrame(()=>output.textContent=JSON.stringify({frames,clicks,selected:bar.querySelector('[aria-checked=true]')?.textContent,trace})));bar.addEventListener('pointercancel',()=>output.textContent='cancel');
</script></body></html>
